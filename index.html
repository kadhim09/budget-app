<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>إدارة الدخل والمصاريف</title>

<style>
body{font-family:system-ui;margin:18px;background:#fafafa}
.wrap{max-width:900px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc}
button{padding:10px;border-radius:10px;border:1px solid #888;background:#f6f6f6;cursor:pointer}
.ok{color:green;font-weight:700}
.warn{color:red;font-weight:700}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h2>إدارة الدخل والمصاريف</h2>
</div>

<div class="card">
<label>الشهر</label>
<input id="monthKey" type="month">
<button onclick="saveMonth()">حفظ هذا الشهر</button>
<button onclick="loadMonth()">تحميل هذا الشهر</button>
<div id="cloudStatus">Cloud: جاهز</div>
</div>

<div class="card grid">
<div><label>الراتب الأول</label><input id="salary1" type="number" value="0"></div>
<div><label>الراتب الثاني</label><input id="salary2" type="number" value="0"></div>
</div>

<div class="card grid">
<div><label>روضة</label><input id="nursery" type="number" value="0"></div>
<div><label>مدرسة</label><input id="school" type="number" value="0"></div>
</div>

<div class="card grid">
<div><label>ملابس طفل</label><input id="babyClothes" type="number" value="0"></div>
<div><label>حليب</label><input id="babyMilk" type="number" value="0"></div>
<div><label>حفاظات</label><input id="babyDiapers" type="number" value="0"></div>
</div>

<div class="card grid">
<div><label>رصيد</label><input id="phone" type="number" value="0"></div>
<div><label>بيت</label><input id="home" type="number" value="0"></div>
<div><label>ثانوي</label><input id="secondary" type="number" value="0"></div>
<div><label>أخرى</label><input id="other" type="number" value="0"></div>
</div>

<div class="card grid">
<div><label>إضافة ادخار</label><input id="savingsAdd" type="number" value="0"></div>
<div><label>إضافة احتياط</label><input id="reserveAdd" type="number" value="0"></div>
</div>

</div>

<script>
const CLOUD_URL="https://script.google.com/macros/s/AKfycbyq-apJa8hRqlcMF8HI6slo-tuW_dTVRvC-Xw0I87C25UyqVknMhB7JZnUtE8zK4wyR/exec";

function n(id){ return Number(document.getElementById(id).value)||0 }
function set(id,v){ document.getElementById(id).value=v }
function currentMonth(){ return document.getElementById("monthKey").value }
function cloudStatus(t){ document.getElementById("cloudStatus").innerText=t }

function captureMonth(){
  return {
    salary1:n("salary1"),
    salary2:n("salary2"),
    nursery:n("nursery"),
    school:n("school"),
    babyClothes:n("babyClothes"),
    babyMilk:n("babyMilk"),
    babyDiapers:n("babyDiapers"),
    phone:n("phone"),
    home:n("home"),
    secondary:n("secondary"),
    other:n("other"),
    savingsAdd:n("savingsAdd"),
    reserveAdd:n("reserveAdd")
  }
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now();
    window[cb]=d=>{delete window[cb];resolve(d)};
    const s=document.createElement("script");
    s.src=url+"&callback="+cb;
    s.onerror=()=>reject();
    document.body.appendChild(s);
  });
}

async function saveMonth(){
  if(!currentMonth()){alert("حدد الشهر");return}
  cloudStatus("Cloud: جاري الحفظ...");
  const payload={month:currentMonth(),global:{savingsBalance:0,reserveBalance:0},monthData:captureMonth(),extraAmount:0};
  const url=CLOUD_URL+"?action=save&payload="+encodeURIComponent(JSON.stringify(payload));
  try{
    const res=await jsonp(url);
    if(res.ok) cloudStatus("Cloud: تم الحفظ ✅");
    else cloudStatus("Cloud: فشل ❌");
  }catch{ cloudStatus("Cloud: خطأ اتصال ❌") }
}

async function loadMonth(){
  if(!currentMonth()){alert("حدد الشهر");return}
  cloudStatus("Cloud: جاري التحميل...");
  const url=CLOUD_URL+"?action=load&month="+currentMonth();
  try{
    const res=await jsonp(url);
    if(!res.ok){cloudStatus("Cloud: لا بيانات");return}
    const d=res.data.monthData||{};
    for(const k in d) if(document.getElementById(k)) set(k,d[k]);
    cloudStatus("Cloud: تم التحميل ✅");
  }catch{ cloudStatus("Cloud: خطأ اتصال ❌") }
}
</script>

</body>
</html>
