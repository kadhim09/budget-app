<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>برنامج تقسيم الراتب</title>

<style>
  body{font-family:system-ui,Arial;margin:18px;background:#fafafa;line-height:1.6}
  .wrap{max-width:980px;margin:auto}
  .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}
  h2,h3{margin:0 0 10px}
  .muted{color:#666;font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  label{display:block;margin-bottom:6px;font-size:14px}
  input{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc}
  input[readonly]{background:#f7f7f7}
  button{padding:10px 14px;border-radius:10px;border:1px solid #999;background:#f6f6f6;cursor:pointer}
  button:active{transform:scale(.99)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btns button{flex:1 1 160px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed #eee}
  .row:last-child{border-bottom:0}
  .ok{font-weight:700}
  .warn{font-weight:700;color:#b00020}
  .status{margin-top:10px;font-size:13px}
  .pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid #ddd;border-radius:999px;background:#fafafa}
  .dot{width:10px;height:10px;border-radius:50%;background:#999;display:inline-block}
  .dot.ok{background:#1b8f3a}
  .dot.warn{background:#b00020}
  @media (max-width:760px){
    .grid,.grid3{grid-template-columns:1fr}
    .btns button{flex:1 1 48%}
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <h2>إدارة الدخل والمصاريف</h2>
    <div class="muted">الحفظ والتحميل يصير من Google Sheet (كلاود). التعديل بالحقل فقط يحسب النتائج — وما ينحفظ إلا إذا تضغط "حفظ".</div>
  </div>

  <div class="card" id="monthCard">
    <h3>الشهر + الحفظ</h3>

    <div>
      <label>الشهر</label>
      <input id="monthKey" type="month">
      <div class="muted">اختر الشهر وبعدين اضغط تحميل. بعد ما تعدّل اضغط حفظ.</div>
    </div>

    <div class="btns" style="margin-top:12px">
      <button type="button" onclick="loadData()">📥 تحميل من الكلاود</button>
      <button type="button" onclick="saveData()">💾 حفظ إلى الكلاود</button>
    </div>

    <div class="status">
      <span class="pill" id="cloudState"><span class="dot"></span> Cloud: جاهز</span>
      <span class="pill" id="saveState"><span class="dot"></span> حالة: بانتظار</span>
    </div>
  </div>

  <div class="card">
    <h3>الدخل</h3>
    <div class="grid">
      <div><label>الراتب الأول</label><input id="salary1" type="number" value="0" min="0" step="1000"></div>
      <div><label>الراتب الثاني</label><input id="salary2" type="number" value="0" min="0" step="1000"></div>
    </div>
    <div class="row"><div>الدخل الكلي</div><div class="ok" id="r_income">-</div></div>
  </div>

  <div class="card">
    <h3>مصاريف</h3>
    <div class="grid">
      <div><label>مدرسة</label><input id="school" type="number" value="0" min="0" step="1000"></div>
      <div><label>بيت</label><input id="home" type="number" value="0" min="0" step="1000"></div>
      <div><label>رصيد/هاتف</label><input id="phone" type="number" value="0" min="0" step="1000"></div>
      <div><label>أخرى</label><input id="other" type="number" value="0" min="0" step="1000"></div>
    </div>

    <div class="row"><div>إجمالي المصاريف</div><div class="ok" id="r_expenses">-</div></div>
    <div class="row"><div>الباقي</div><div id="r_left">-</div></div>
  </div>

</div>

<script>
  // ✅ رابطك انت
  const CLOUD_URL = "https://script.google.com/macros/s/AKfycbzL9QLaaXmJVIHffVItmU67zmT9heepRWm6loBXJ_ot3xn8C0iaM-or627rOYEeoBqiMQ/exec";

  const el = (id) => document.getElementById(id);
  const n = (id) => Number(el(id).value) || 0;

  function fmt(v){
    const x = Math.round(Number(v)||0);
    return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + " د.ع";
  }

  function setPill(id, text, ok=true){
    const box = el(id);
    if(!box) return;
    const dot = box.querySelector(".dot");
    if(dot){
      dot.classList.remove("ok","warn");
      dot.classList.add(ok ? "ok" : "warn");
    }
    box.childNodes[1].nodeValue = " " + text;
  }

  function getThisMonth(){
    const d = new Date();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    return `${d.getFullYear()}-${mm}`;
  }

  function calc(){
    const income = n("salary1") + n("salary2");
    const exp = n("school") + n("home") + n("phone") + n("other");
    const left = income - exp;

    el("r_income").textContent = fmt(income);
    el("r_expenses").textContent = fmt(exp);

    const leftEl = el("r_left");
    leftEl.textContent = fmt(left);
    leftEl.className = (left >= 0) ? "ok" : "warn";

    setPill("saveState", "حالة: تغييرات غير محفوظة", false);
  }
